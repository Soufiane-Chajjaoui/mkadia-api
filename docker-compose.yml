services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mkadia-db'
      - 'POSTGRES_PASSWORD=soufianch'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: soufianch
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - '5050:5050'
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: mkadia-objects
    ports:
      - '9200:9000'  # Port de l'interface web MinIO
      - '9001:9001'  # Port d'API (facultatif, utilisé pour l'outil mc de MinIO)
    volumes:
      - minio-data:/data  # Volume pour persister les données
    command: server /data --console-address ":9001" # Commande pour démarrer le serveur MinIO
    restart: always
volumes:
  postgres-data:
  minio-data: